<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNUWET - 웹캠 및 화면 녹화</title>
    <style>
        .container {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }
        .video-container {
            width: 30%;
        }
        canvas, video {
            width: 100%;
            border: 1px solid #ccc;
        }
        .button-container {
            text-align: center;
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            display: none;
        }
        #startBtn {
            display: inline-block;
        }
        #faceInfo {
            margin-top: 20px;
            text-align: center;
            font-size: 18px;
        }
        #guideOverlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        #guideModal {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 18vh;
            background: #fff;
            color: #333;
            padding: 20px 28px;
            border-radius: 10px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
            max-width: 90%;
            font-size: 18px;
            text-align: center;
            display: none;
        }
        #guideFooter {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 12vh;
            background: #fff;
            color: #333;
            padding: 24px 32px;
            border-radius: 10px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
            text-align: center;
            font-size: 24px;
            display: none;
        }
        @keyframes pulseOutline {
            0% { box-shadow: 0 0 0 0 rgba(51,136,255,0.7); }
            70% { box-shadow: 0 0 0 10px rgba(51,136,255,0); }
            100% { box-shadow: 0 0 0 0 rgba(51,136,255,0); }
        }
        .pulse-outline {
            border: 2px solid #3388ff !important;
            animation: pulseOutline 1.6s ease-out infinite;
            border-radius: 8px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="tracker.js"></script>
    
</head>
<body>
    <h1>SNUWET - 웹캠 및 화면 녹화</h1>
    <div class="button-container">
        <button id="startBtn">시작</button>
        <button id="stopBtn" disabled>완료</button>
        <button id="calibrationBtn" style="display: none;">캘리브레이션 시작</button>
    </div>
    <div class="container">
        <div class="video-container">
            <h2>웹캠</h2>
            <canvas id="output"></canvas>
            <div id="faceInfo">감지된 얼굴 없음</div>
        </div>
        <div class="video-container" style="position: relative;">
            <h2>화면 녹화</h2>
            <video id="screen" autoplay muted></video>
        </div>
    </div>

    <div id="calibrationScreen" style="display:none; position: fixed; top:0; left:0; width:100%; height:100%; background-color:black; z-index:1000;">
        <canvas id="calibrationCanvas" width="1920" height="1080" style="width:100%; height:100%;"></canvas>
    </div>
    <div id="guideOverlay">
        <div id="guideModal">Preparing...</div>
        <div id="guideFooter"></div>
    </div>
    <script src="app.js"></script>
    <div style="text-align: center; position: fixed; bottom: 0; left: 0; right: 0; padding: 10px;">
        <a href="https://colab.research.google.com/drive/1eI8z8jfMfb8P_rjtHqxgV5xdbQHmupay?usp=drive_link" target="_blank" style="color: #888; text-decoration: underline;">Generate gaze plot video with GoogleColab</a>
    </div>
</body>
</html>
